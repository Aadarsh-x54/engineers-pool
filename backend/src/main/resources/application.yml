server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: engineers-pool-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:engineers_pool}}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:55MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  security:
    jwt-secret: ${ENGINEERS_POOL_JWT_SECRET:change-this-secret-to-at-least-32-characters-before-production}
    jwt-expiration-minutes: ${ENGINEERS_POOL_JWT_EXPIRATION_MINUTES:720}
    admin-email: ${ENGINEERS_POOL_ADMIN_EMAIL:admin@engineerspool.local}
    admin-password: ${ENGINEERS_POOL_ADMIN_PASSWORD:0000}
    google-client-id: ${GOOGLE_CLIENT_ID:}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-root: ${LOCAL_STORAGE_ROOT:uploads}
    allowed-types: PDF,DOC,DOCX,PPT,PPTX,ZIP
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:52428800}
  rate-limit:
    downloads-per-minute: ${DOWNLOADS_PER_MINUTE:30}
